<section class="trust-strip" aria-label="Trust indicators">
    <div class="trust-strip-inner" data-animate="fade-in">
        {% for item in trust_indicators %}
            <div class="trust-item"><span class="trust-icon"><svg><use href="#icon-check"></use></svg></span> {{ item.label }}</div>
        {% empty %}
            <div class="trust-item"><span class="trust-icon"><svg><use href="#icon-check"></use></svg></span> Local & Reliable</div>
            <div class="trust-item"><span class="trust-icon"><svg><use href="#icon-check"></use></svg></span> Emergency Call-outs</div>
            <div class="trust-item"><span class="trust-icon"><svg><use href="#icon-check"></use></svg></span> Clear Upfront Advice</div>
            <div class="trust-item"><span class="trust-icon"><svg><use href="#icon-check"></use></svg></span> Tidy Workmanship</div>
            <div class="trust-item"><span class="trust-icon"><svg><use href="#icon-check"></use></svg></span> Fully Insured*</div>
        {% endfor %}
    </div>
</section>
